<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Caveat:wght@500;700&family=Patrick+Hand&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2; --card:#fcfcfa; --ink:#3d3836; --soft:#8d8582; --rose:#c98b95; --guide:#dcd8d4; --line:#e7e3df;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f1d1e; --card:#2a2627; --ink:#eee8e6; --soft:#a79e9b; --rose:#d9a0aa; --guide:#403b3c; --line:#3a3536; }
}
:root[data-theme="dark"]{ --bg:#1f1d1e; --card:#2a2627; --ink:#eee8e6; --soft:#a79e9b; --rose:#d9a0aa; --guide:#403b3c; --line:#3a3536; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.15;margin:6px 0 10px}
.hand{font-family:'Caveat',cursive;font-weight:700;font-size:1.5rem;color:var(--soft)}
.hero{max-width:560px;margin:0 auto;padding:18vh 24px 40px;text-align:center}
.hero p{color:var(--soft);margin:0}
.arrow{display:block;margin:34px auto 0;width:1px;height:46px;background:var(--rose);animation:drop 2s ease-in-out infinite;transform-origin:top}
@keyframes drop{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

.wrap{position:relative;max-width:560px;margin:0 auto}
svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
#base{fill:none;stroke:var(--guide);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round}
#line{fill:none;stroke:var(--rose);stroke-width:2;stroke-linecap:round}

.it{position:absolute;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(8px)}
.it.on{opacity:1;transform:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--rose);margin:-6px 0 0 -6px}
.tag{width:min(60%,270px);text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:border-radius .3s,box-shadow .3s;margin-top:-18px;z-index:1}
.tag .t{font-size:.9rem;color:var(--soft);display:block;line-height:1.3;padding:3px 0}
.tag .m{display:block;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .4s;font-family:'Patrick Hand','Caveat',cursive;font-weight:400;font-size:1.15rem;line-height:1.45;color:var(--ink)}
.tag.open{border-radius:18px;box-shadow:0 8px 24px rgba(120,90,95,.14);z-index:3}
.tag.open .m{max-height:400px;opacity:1;padding:4px 0 8px}
.tag.open .t{color:var(--rose)}

.photo{left:50%;width:min(240px,64%);margin-left:0;z-index:2}
.photo.on{transform:translate(-50%,-50%)}
.photo{transform:translate(-50%,calc(-50% + 8px))}
.frame{background:var(--card);border:1px solid var(--line);padding:10px 10px 6px;border-radius:4px;box-shadow:0 10px 28px rgba(120,90,95,.15);transform:rotate(-1.5deg)}
.img{aspect-ratio:4/5;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.img img{width:100%;height:100%;object-fit:cover}
.img i{font-style:normal;font-size:.85rem;color:var(--soft)}
.cap{font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;text-align:center;color:var(--soft);padding-top:4px}

.end{left:0;right:0;text-align:center;padding:0 24px}
.end svg{position:static;width:30px;height:28px;fill:var(--rose);display:block;margin:-14px auto 12px;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}}
.end h2{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:500;margin:0 0 6px;line-height:1.3}
.end p{color:var(--soft);margin:0}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.arrow,.end svg{animation:none}.it,.tag .m{transition:none}}
</style>
</head>

    { t: "Abba three", m: "And and i miss being your baba and playing the fool and doing things to get petted by you ane. And and make that sadddd face with the line mouth so I can hear you say “Pawwww ummaaa” heheheheh how how" },
    { t: "Abba four", m: "Idk if you believe me but im still in love with you and still you hold a huge place in my heart ma. you actually have a special heart in my place **Blushy and bullying face** heheheheheheh" },
    { t: "Abba five", m: "I miss all our memories and our mongalness and how comfortable we were with eachother (like how you accidentally did kakka in your underwear and threw it cuz you felt bwakka to wash it hehehehehehehe lalalalalalalaaaaa)" },
    { t: "Abba SIXXXX", m: "Finally, I wanna say that I love you so much my ungu ma, baba deda, baba caretaker, baba mongal partner, chukku bukku, chakala banis, 2 year old baba, medh, almond, chuti manika, my chellam, hayathi, meri jaan, and my forever astronaut." }
  ],
  endTitle: "I love you forever",
  endText: ""
};

const $ = s => document.querySelector(s);
$('#title').textContent = CONFIG.title;
$('#intro').textContent = CONFIG.intro;

const wrap = $('#wrap'), svg = $('#svg'), line = $('#line'), base = $('#base');
const N = CONFIG.notes, half = 3;
const items = [...N.slice(0, half).map(n => ({k:'note', ...n})), {k:'photo', ...CONFIG.photo}, ...N.slice(half).map(n => ({k:'note', ...n}))];

/* layout in px down the page */
let cur = 110, side = 0;
items.forEach(it => {
  if (it.k === 'photo') { cur += 150; it.y = cur; it.x = .5; cur += 250; }
  else { it.y = cur; it.x = side % 2 === 0 ? .3 : .7; it.side = side % 2; side++; cur += 240; }
});
const endY = cur + 90, H = endY + 200;
wrap.style.height = H + 'px';

/* build elements */
const els = [];
items.forEach(it => {
  if (it.k === 'photo') {
    const d = document.createElement('div');
    d.className = 'it photo'; d.style.top = it.y + 'px';
    const pic = it.src ? `<img src="${it.src}" alt="${it.caption}">` : `<i>your photo here ♡</i>`;
    d.innerHTML = `<div class="frame"><div class="img">${pic}</div><div class="cap">${it.caption}</div></div>`;
    wrap.appendChild(d); els.push({el:d, y:it.y});
  } else {
    const dot = document.createElement('div');
    dot.className = 'it dot'; dot.style.left = it.x*100 + '%'; dot.style.top = it.y + 'px';
    const tag = document.createElement('button');
    tag.className = 'it tag'; tag.style.top = it.y + 'px';
    if (it.side === 0) tag.style.left = `calc(${it.x*100}% + 18px)`; else tag.style.right = `calc(${(1-it.x)*100}% + 18px)`;
    tag.innerHTML = `<span class="t"></span><span class="m"></span>`;
    tag.querySelector('.t').textContent = it.t; tag.querySelector('.m').textContent = it.m;
    tag.setAttribute('aria-expanded','false');
    tag.onclick = () => {
      const o = !tag.classList.contains('open');
      document.querySelectorAll('.tag.open').forEach(x => { x.classList.remove('open'); x.setAttribute('aria-expanded','false'); });
      if (o) { tag.classList.add('open'); tag.setAttribute('aria-expanded','true'); }
    };
    wrap.append(dot, tag); els.push({el:dot, y:it.y}, {el:tag, y:it.y});
  }
});
const end = document.createElement('div');
end.className = 'it end'; end.style.top = endY + 'px';
end.innerHTML = `<svg viewBox="0 0 32 29"><path d="M23.6 0c-2.9 0-5.4 1.6-7.6 4.6C13.8 1.6 11.3 0 8.4 0 3.7 0 0 3.8 0 8.5c0 9.8 14.3 19.1 15.5 20.1.3.2.7.2 1 0C17.7 27.6 32 18.3 32 8.5 32 3.8 28.3 0 23.6 0z"/></svg><h2></h2><p></p><div class="hand" style="margin-top:14px"></div>`;
end.querySelector('h2').textContent = CONFIG.endTitle;
end.querySelector('p').textContent = CONFIG.endText;
end.querySelector('.hand').textContent = '— ' + CONFIG.from;
wrap.appendChild(end); els.push({el:end, y:endY - 10});

/* path */
let samples = [];
function build() {
  const W = wrap.clientWidth;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
  const pts = [[W/2, 0], ...items.map(i => [i.x*W, i.y]), [W/2, endY]];
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], m = (y0+y1)/2;
    d += ` C${x0},${m} ${x1},${m} ${x1},${y1}`;
  }
  base.setAttribute('d', d); line.setAttribute('d', d);
  const L = line.getTotalLength(); samples = [];
  for (let i = 0; i <= 240; i++) { const p = line.getPointAtLength(L*i/240); samples.push(p.y); }
}

const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function update() {
  const top = wrap.getBoundingClientRect().top;
  let drawn = calm ? endY : Math.min(Math.max(innerHeight*0.7 - top, 0), endY);
  let k = samples.findIndex(y => y >= drawn); if (k < 0) k = samples.length - 1;
  const frac = drawn >= endY - 1 ? 1 : k / (samples.length - 1);
  line.style.strokeDashoffset = 1 - frac;
  line.style.opacity = drawn <= 0 ? 0 : 1;
  els.forEach(o => o.el.classList.toggle('on', o.y <= drawn + 6));
}
let tick = false;
const req = () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; update(); }); } };
addEventListener('scroll', req, {passive:true});
addEventListener('resize', () => { build(); update(); });
build(); update();
</script>
